<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">


  <!-- FontAwesome 6 Pro (self-hosted, same assets as replyagent) so Pro-only
       icons like fa-shield-check / fa-badge-check render. Replaces the free CDN. -->
  <link rel="stylesheet" href="/fontawesome6/css/all.min.css" />

  <!-- Apply the last-known white-label colour + theme mode BEFORE first paint, so
       the page never flashes the default blue while branding loads from the API.
       Mirrors the CSS variables set in ThemeContext. -->
  <!-- API base URL injected by vite.config.ts plugin — index.html is no-cache
       so this always reflects the latest deploy even when the JS bundle is cached. -->
  <script>window.__API_BASE_URL__ = "__BACKEND_URL__";</script>

  <script>
    (function () {
      try {
        var c = document.cookie.match(/(?:^|; )themePrimaryColor=([^;]+)/);
        if (c) {
          var color = decodeURIComponent(c[1]);
          var s = document.documentElement.style;
          s.setProperty('--primary', color);
          s.setProperty('--ring', color);
          s.setProperty('--sidebar-primary', color);
          s.setProperty('--sidebar-ring', color);
          s.setProperty('--chart-1', color);
        }
        var m = document.cookie.match(/(?:^|; )themeMode=([^;]+)/);
        if (m && decodeURIComponent(m[1]) === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
