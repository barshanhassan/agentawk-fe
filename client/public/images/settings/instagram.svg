<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 560" fill="none">
  <!-- Phone outer frame -->
  <rect x="0" y="0" width="280" height="560" rx="35" fill="#e5e7eb"/>
  
  <!-- Phone screen -->
  <rect x="8" y="8" width="264" height="544" rx="28" fill="#ffffff"/>
  
  <!-- Notch -->
  <rect x="95" y="8" width="90" height="22" rx="11" fill="#4a5568"/>
  
  <!-- Status bar -->
  <g transform="translate(0, 30)">
    <!-- Time -->
    <text x="20" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#000" font-weight="500">12:30 pm</text>
    
    <!-- Signal and battery icons -->
    <g transform="translate(230, 4)">
      <rect x="0" y="2" width="2" height="8" rx="1" fill="#000"/>
      <rect x="4" y="0" width="2" height="10" rx="1" fill="#000"/>
      <rect x="8" y="3" width="2" height="7" rx="1" fill="#000"/>
      <circle cx="18" cy="5" r="4" fill="none" stroke="#000" stroke-width="1"/>
      <rect x="26" y="1" width="16" height="8" rx="2" stroke="#000" stroke-width="1" fill="none"/>
      <rect x="42" y="3" width="2" height="4" rx="1" fill="#000"/>
    </g>
  </g>
  
  <!-- Header bar -->
  <g transform="translate(0, 55)">
    <rect x="8" y="0" width="264" height="44" fill="#8e8e8e"/>
    
    <!-- Back arrow -->
    <path d="M 24 22 L 18 22 M 24 18 L 18 22 L 24 26" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Username -->
    <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#1a1a1a" font-weight="500">anabeninivideos</text>
    
    <!-- Menu icon (three lines) -->
    <g transform="translate(250, 16)">
      <rect x="0" y="0" width="14" height="2" rx="1" fill="#1a1a1a"/>
      <rect x="0" y="5" width="14" height="2" rx="1" fill="#1a1a1a"/>
      <rect x="0" y="10" width="14" height="2" rx="1" fill="#1a1a1a"/>
    </g>
  </g>
  
  <!-- Profile section -->
  <g transform="translate(0, 99)">
    <rect x="8" y="0" width="264" height="120" fill="#999999"/>
    
    <!-- Content centered -->
    <g transform="translate(140, 60)">
      <!-- Profile name -->
      <text x="0" y="-20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#1a1a1a" font-weight="600" text-anchor="middle">anabeninivideos</text>
      <text x="0" y="-2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle">Instagram</text>
      
      <!-- View Profile button -->
      <rect x="-45" y="10" width="90" height="28" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
      <text x="0" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#1a1a1a" font-weight="500" text-anchor="middle">View Profile</text>
    </g>
  </g>
  
  <!-- White content area -->
  <g transform="translate(0, 219)">
    <rect x="8" y="0" width="264" height="333" fill="#ffffff"/>
    
    <!-- More options section -->
    <g transform="translate(140, 30)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#1a1a1a" font-weight="600" text-anchor="middle">More options</text>
      
      <!-- Description text -->
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#0095f6" text-anchor="middle">
        <tspan x="0" dy="0">Tap to send a question suggested by</tspan>
      </text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#0095f6" font-weight="500" text-anchor="middle">anabeninivideos</text>
    </g>
  </g>
  
  <!-- Bottom home indicator -->
  <rect x="110" y="530" width="60" height="4" rx="2" fill="#d1d5db"/>
</svg>
